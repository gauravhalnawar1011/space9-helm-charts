apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: backend-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/gauravhalnawar1011/space9-helm-charts.git
    targetRevision: main
    path: charts/python-backend

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true