apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "python-backend.fullname" . }}
  namespace: {{ .Values.namespace }}

data:
  DB_HOST: {{ .Values.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.config.DB_PORT | quote }}
  DB_NAME: {{ .Values.config.DB_NAME | quote }}
  DB_SSLMODE: {{ .Values.config.DB_SSLMODE | quote }}
  FLASK_ENV: {{ .Values.config.FLASK_ENV | quote }}
  GUNICORN_WORKERS: {{ .Values.config.GUNICORN_WORKERS | quote }}