apiVersion: v1
kind: Service

metadata:
  name: {{ include "python-backend.fullname" . }}
  namespace: {{ .Values.namespace }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "python-backend.name" . }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}