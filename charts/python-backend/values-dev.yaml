namespace: dev

replicaCount: 2

image:
  repository: 239713807106.dkr.ecr.ap-south-1.amazonaws.com/space9-python-backend
  tag: dev-f9c3eb8
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

config:
  DB_HOST: production-eks-platform-dev-postgres.ctkyce4k6j88.ap-south-1.rds.amazonaws.com
  DB_PORT: "5432"
  DB_NAME: studentdb
  DB_SSLMODE: require
  FLASK_ENV: production
  GUNICORN_WORKERS: "2"

secret:
  DB_USERNAME: postgres
  DB_PASSWORD: ChangeMe123!

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

ingress:
  enabled: true
  className: alb

  host: dev-api.space9.in

  annotations:
    kubernetes.io/ingress.class: alb

    alb.ingress.kubernetes.io/group.name: platform-dev
    alb.ingress.kubernetes.io/group.order: "10"

    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:239713807106:certificate/a5c67648-ad41-4df6-928e-d976693b38f4

    alb.ingress.kubernetes.io/healthcheck-path: /health
    

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""
  
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80